[project]
name = "osint2"
version = "0.1.0"
description = "People intelligence research agent built scorer first, with an evaluation ladder (Sixtyfour take home, v2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "holehe>=1.61",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
]

[dependency-groups]
deploy = ["modal>=1.5.4"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint2"]

[tool.uv]
package = true
